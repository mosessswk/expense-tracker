name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: npm ci
        run: npm ci
        working-directory: ./frontend

      - name: npm test
        run: npm test
        working-directory: ./frontend
      
      - name: build frontend
        run: npm run build
        working-directory: ./frontend

      - name: npm ci
        run: npm ci
        working-directory: ./backend

      - name: docker compose config
        run: docker compose config