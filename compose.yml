services:
    backend:
        build: 
            context: ./backend
        env_file:
            - ./backend/.env
        ports:
            - '3000:3000'
        environment:
            DB_HOST: database
            DB_PORT: 5432
            DB_NAME: ${POSTGRES_DB}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
        depends_on:
            database:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "node -e \"const req = require('http').request('http://localhost:3000/', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)); req.on('error', () => process.exit(1)); req.end();\""]
            interval: 5s
            timeout: 5s
            retries: 5

    frontend:
        build: 
            context: ./frontend
            dockerfile: Dockerfile.prod
        ports:
            - '5173:80'
        depends_on:
            backend:
                condition: service_healthy 
    database:
        image: postgres:17
        ports: 
            - '5432:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/database:/docker-entrypoint-initdb.d

volumes:
    postgres_data: